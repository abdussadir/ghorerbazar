<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
    aria-label="Courier delivery truck">
    <defs>
        <clipPath id="courierCircle">
            <circle cx="256" cy="256" r="236" />
        </clipPath>
        <pattern id="courierHatch" width="18" height="18" patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)">
            <rect width="18" height="18" fill="#2b3a57" />
            <rect width="9" height="18" fill="#ffffff" />
        </pattern>
    </defs>

    <!-- Badge -->
    <circle cx="256" cy="256" r="236" fill="#2c7cf2" />

    <!-- Long shadow -->
    <g clip-path="url(#courierCircle)">
        <path d="M101 352 L101 152 L321 152 L410 197 L449 197 L449 352
                 L869 772 L869 617 L830 617 L741 572 L521 572 L521 772 Z" fill="#1f6ae0" />
    </g>

    <!-- Speed lines -->
    <rect x="72" y="185" width="68" height="14" rx="7" fill="#ffffff" />
    <rect x="90" y="209" width="44" height="14" rx="7" fill="#ffffff" />

    <!-- Cargo box -->
    <path d="M112 152 H200 V177 H101 V163 A11 11 0 0 1 112 152 Z" fill="#ffffff" />
    <rect x="156" y="152" width="165" height="163" fill="#ffffff" />
    <rect x="109" y="251" width="59" height="64" fill="#ffffff" />

    <!-- Strapping tape -->
    <rect x="167" y="152" width="24" height="163" fill="url(#courierHatch)" />
    <rect x="109" y="232" width="212" height="19" fill="url(#courierHatch)" />

    <!-- Handling symbols: fragile, this way up, keep dry -->
    <g fill="#2b3a57">
        <path d="M216 175 H232 L229 191 H219 Z" />
        <rect x="222" y="191" width="4" height="12" />
        <rect x="214" y="203" width="20" height="5" rx="2" />

        <path d="M248 174 L256 185 H252 V206 H244 V185 H240 Z" />
        <path d="M266 174 L274 185 H270 V206 H262 V185 H258 Z" />

        <path d="M285 176 A15 15 0 0 1 300 191 H270 A15 15 0 0 1 285 176 Z" />
        <rect x="283" y="191" width="4" height="13" />
        <path d="M283 202 A6 6 0 0 0 295 202 H289 A0 0 0 0 1 289 202 Z" />
    </g>

    <!-- Shipping label -->
    <g fill="#2b3a57">
        <rect x="212" y="262" width="80" height="6" rx="3" />
        <rect x="212" y="273" width="80" height="6" rx="3" />
        <rect x="212" y="284" width="80" height="6" rx="3" />
        <rect x="212" y="295" width="80" height="6" rx="3" />
    </g>

    <!-- Cab -->
    <path d="M321 315 V197 H410 A39 39 0 0 1 449 236 V315 Z" fill="#2b3a57" />
    <path d="M352 214 H419 A9 9 0 0 1 428 223 V263 H346 V220 A6 6 0 0 1 352 214 Z" fill="#f4f7fb" />

    <!-- Chassis -->
    <rect x="101" y="315" width="352" height="30" rx="8" fill="#2b3a57" />
    <rect x="101" y="317" width="14" height="24" rx="4" fill="#f4642a" />
    <circle cx="438" cy="310" r="7" fill="#ffffff" />

    <!-- Wheels -->
    <g>
        <circle cx="179" cy="352" r="47" fill="#ffffff" />
        <circle cx="179" cy="352" r="40" fill="#202c47" />
        <circle cx="179" cy="352" r="19" fill="#ffffff" />
        <circle cx="179" cy="352" r="9" fill="#202c47" />
    </g>
    <g>
        <circle cx="370" cy="352" r="47" fill="#ffffff" />
        <circle cx="370" cy="352" r="40" fill="#202c47" />
        <circle cx="370" cy="352" r="19" fill="#ffffff" />
        <circle cx="370" cy="352" r="9" fill="#202c47" />
    </g>
</svg>
